<!-- Logo preloader: gold dust rises, the five stars land on the crest, the crest rises, then flies into the menu logo.
     Shows whenever someone opens or refreshes the site; skipped when moving between pages of the site. -->
<div class="pl" id="preloader" role="status" aria-live="polite" aria-label="Loading Fr. Agnel Higher Secondary School">
  <div class="pl-rays" aria-hidden="true"></div>
  <div class="pl-dust" id="plDust" aria-hidden="true"></div>
  <div class="pl-flash" id="plFlash" aria-hidden="true"></div>
  <div class="pl-stage" id="plStage" aria-hidden="true">
    <div class="pl-halo"></div>
    <svg class="pl-crest" id="plCrest" viewBox="0 0 160 238">
      <defs>
        <clipPath id="plShield"><path d="M80,1.5 C58,18 32,28 2,31 L2,166 C4,212 40,236.5 80,236.5 C120,236.5 156,212 158,166 L158,31 C128,28 102,18 80,1.5 Z"/></clipPath>
        <mask id="plRiseMask" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="238"><rect id="plRise" x="0" y="0" width="160" height="238" fill="#fff"/></mask>
        <linearGradient id="plScanGrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff3b0" stop-opacity="0"/><stop offset=".5" stop-color="#fff3b0"/><stop offset="1" stop-color="#f4c400" stop-opacity="0"/></linearGradient>
      </defs>
      <g clip-path="url(#plShield)">
        <image href="images/logo.png" x="0" y="0" width="160" height="238" preserveAspectRatio="none" mask="url(#plRiseMask)"/>
        <rect id="plScan" x="-10" y="-6" width="180" height="12" fill="url(#plScanGrad)" opacity="0"/>
      </g>
      <path class="pl-outline" pathLength="1" d="M80,1.5 C58,18 32,28 2,31 L2,166 C4,212 40,236.5 80,236.5 C120,236.5 156,212 158,166 L158,31 C128,28 102,18 80,1.5 Z"/>
    </svg>
  </div>
  <div class="pl-motto" id="plMotto" aria-hidden="true"></div>
  <div class="pl-meta" aria-hidden="true">
    <span class="pl-year" id="plYear">1979</span>
    <span class="pl-bar"><i id="plBar"></i></span>
    <span class="pl-label">Fr. Agnel Higher Secondary School · Pilar</span>
  </div>
  <div class="pl-skip" aria-hidden="true">Click anywhere to skip</div>
</div>
<script>
(function(){
  var pl = document.getElementById('preloader');
  var root = document.documentElement;
  root.classList.add('js');

  /* Show on opening or refreshing the site; skip when arriving from another page of this site */
  var nav = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || {};
  var internal = false;
  try { internal = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch (e) {}
  if (internal && nav.type !== 'reload') { pl.remove(); root.classList.add('ready'); return; }

  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.body.classList.add('is-loading');
  var stage = document.getElementById('plStage'), crest = document.getElementById('plCrest');
  var flash = document.getElementById('plFlash'), dust = document.getElementById('plDust');
  var yearEl = document.getElementById('plYear'), bar = document.getElementById('plBar');
  var rise = document.getElementById('plRise'), scan = document.getElementById('plScan');
  var motto = document.getElementById('plMotto');
  var t0 = performance.now(), MIN = reduce ? 300 : 3000, MAX = 6000;
  var nowYear = new Date().getFullYear(), loaded = false, finished = false;
  var wait = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };
  var rand = function(a, b){ return a + Math.random() * (b - a); };

  /* Letters of the motto, ready to rise */
  'ALWAYS HIGHER'.split('').forEach(function(ch, i){
    var s = document.createElement('span');
    s.textContent = ch === ' ' ? ' ' : ch;
    s.style.setProperty('--i', i);
    if (i > 6) s.className = 'gold';
    motto.appendChild(s);
  });

  /* Gold dust drifting up */
  if (!reduce) for (var d = 0; d < 34; d++) {
    var sp = document.createElement('i');
    sp.style.cssText = 'left:' + rand(0, 100).toFixed(1) + '%;--s:' + rand(1.5, 4.5).toFixed(1) + 'px;--life:' + rand(4, 9).toFixed(1) + 's;--wait:' + (-rand(0, 8)).toFixed(1) + 's;--drift:' + rand(-60, 60).toFixed(0) + 'px';
    dust.appendChild(sp);
  }

  /* The year counter and bar follow time, parking at 90% until the page is ready */
  (function tick(now){
    if (finished) return;
    var p = Math.min(1, (now - t0) / MIN);
    if (!loaded && now - t0 < MAX) p = Math.min(p, 0.9);
    bar.style.transform = 'scaleX(' + p.toFixed(3) + ')';
    yearEl.textContent = Math.round(1979 + (nowYear - 1979) * p);
    requestAnimationFrame(tick);
  })(t0);

  function ring(size, delay){
    var w = document.createElement('i');
    w.className = 'pl-ring';
    stage.appendChild(w);
    w.animate([{ transform: 'translate(-50%,-50%) scale(.2)', opacity: .9 }, { transform: 'translate(-50%,-50%) scale(' + size + ')', opacity: 0 }],
      { duration: 700, delay: delay || 0, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'backwards' }).finished.then(function(){ w.remove(); });
  }

  /* The five stars of the crest (positions as % of the crest) */
  var STARS = [[25.6, 32.6], [40.3, 29], [40.3, 37.6], [25.4, 41.4], [40.3, 46.4]];
  function flyStars(){
    var box = stage.getBoundingClientRect();
    return Promise.all(STARS.map(function(s, i){
      var star = document.createElement('i');
      star.className = 'pl-star';
      star.style.left = s[0] + '%'; star.style.top = s[1] + '%';
      stage.appendChild(star);
      var ang = rand(0, Math.PI * 2), dist = rand(0.9, 1.4) * Math.max(innerWidth, innerHeight) * 0.5;
      var dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
      return star.animate([
        { transform: 'translate(-50%,-50%) translate(' + dx + 'px,' + dy + 'px) rotate(-260deg) scale(1.8)', opacity: 0 },
        { opacity: 1, offset: .25 },
        { transform: 'translate(-50%,-50%) rotate(0deg) scale(1)', opacity: 1 }
      ], { duration: 620, delay: i * 130, easing: 'cubic-bezier(.2,.8,.25,1)', fill: 'both' }).finished.then(function(){
        var mini = document.createElement('i');
        mini.className = 'pl-ring pl-ring-mini';
        mini.style.left = s[0] + '%'; mini.style.top = s[1] + '%';
        stage.appendChild(mini);
        mini.animate([{ transform: 'translate(-50%,-50%) scale(.3)', opacity: 1 }, { transform: 'translate(-50%,-50%) scale(2.6)', opacity: 0 }], { duration: 450, easing: 'ease-out' }).finished.then(function(){ mini.remove(); });
        return star;
      });
    }));
  }

  function riseCrest(){
    scan.animate([{ opacity: 0, transform: 'translateY(244px)' }, { opacity: 1, offset: .1 }, { opacity: 1, offset: .9 }, { opacity: 0, transform: 'translateY(0)' }], { duration: 760, easing: 'cubic-bezier(.45,0,.2,1)' });
    return rise.animate([{ transform: 'translateY(238px)' }, { transform: 'translateY(0)' }], { duration: 760, easing: 'cubic-bezier(.45,0,.2,1)', fill: 'forwards' }).finished;
  }

  function burst(stars){
    flash.animate([{ opacity: .55 }, { opacity: 0 }], { duration: 420, easing: 'ease-out' });
    ring(3.4); ring(2.2, 90);
    stars.forEach(function(st){ st.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400, fill: 'forwards' }); });
    crest.animate([{ transform: 'scale(.96)', filter: 'brightness(1.6) drop-shadow(0 0 30px rgba(244,196,0,.9))' }, { transform: 'scale(1.04)', offset: .35 }, { transform: 'none', filter: 'none' }], { duration: 700, easing: 'ease-out' });
    pl.classList.add('pl-burst');
  }

  var heroSrc = document.body.dataset.hero || 'images/school-campus-wide.jpg';
  var heroImg = new Image();
  heroImg.src = matchMedia('(max-width:760px)').matches ? heroSrc.replace('images/', 'images/800/') : heroSrc;
  var domReady = new Promise(function(r){ document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', r, { once: true }) : r(); });
  Promise.race([Promise.all([domReady, (heroImg.decode ? heroImg.decode() : Promise.resolve()).catch(function(){})]), wait(4000)]).then(function(){ loaded = true; });

  function finish(){
    if (finished) return;
    finished = true;
    if (window.performance && performance.mark) performance.mark('preloader-done');
    bar.style.transform = 'scaleX(1)'; yearEl.textContent = nowYear;
    var logo = document.querySelector('header .logo');
    var r = logo && logo.getBoundingClientRect();
    if (r && r.bottom > 0 && !reduce) {
      var c = crest.getBoundingClientRect();
      var dx = r.left + r.width / 2 - (c.left + c.width / 2), dy = r.top + r.height / 2 - (c.top + c.height / 2);
      pl.style.setProperty('--cx', (r.left + r.width / 2) + 'px');
      pl.style.setProperty('--cy', (r.top + r.height / 2) + 'px');
      stage.animate([{ transform: 'none' }, { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + (r.height / c.height) + ')' }], { duration: 700, easing: 'cubic-bezier(.65,0,.2,1)', fill: 'forwards' });
      logo.animate([{ opacity: 0 }, { opacity: 0 }], { duration: 700 });
      logo.animate([{ transform: 'scale(1.35) rotate(-8deg)', filter: 'brightness(1.4) drop-shadow(0 0 14px rgba(244,196,0,.9))' }, { transform: 'none', filter: 'none' }], { duration: 520, delay: 700, easing: 'cubic-bezier(.34,1.56,.64,1)' });
    }
    pl.classList.add('pl-out');
    setTimeout(function(){
      document.body.classList.remove('is-loading');
      root.classList.add('ready');
      document.dispatchEvent(new Event('preloader:done'));
    }, reduce ? 0 : 520);
    setTimeout(function(){ pl.remove(); }, reduce ? 350 : 1100);
  }
  pl.addEventListener('click', function(){ if (performance.now() - t0 > 500) finish(); });
  addEventListener('keydown', function(e){ if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') finish(); });

  if (reduce) { Promise.race([domReady, wait(800)]).then(function(){ setTimeout(finish, 250); }); return; }

  (async function(){
    await wait(380);                 /* outline starts drawing (CSS) */
    if (finished) return;
    var stars = await flyStars();    /* five stars land one by one */
    if (finished) return;
    await riseCrest();               /* crest rises behind a gold scan-line */
    if (finished) return;
    burst(stars);                    /* flash, shockwave, motto rises */
    var left = MIN - (performance.now() - t0);
    await Promise.all([wait(Math.max(1150, left)), new Promise(function(r){ (function chk(){ loaded || performance.now() - t0 > MAX ? r() : setTimeout(chk, 60); })(); })]);
    finish();
  })();
})();
</script>
